<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo Night – Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16262b;--panel:#1d3238;--line:#2c4a52;--ink:#eef3ee;--mute:#8fa8a6;--paper:#f6f1e3;--pi:#1b2428;--dab:#e8457c;--gold:#f6c343;--red:#ef5350;--orange:#f39c32;--pat:#1fb5c9;--cs:150px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.3 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--line);border:0;border-radius:6px;padding:8px 10px;cursor:pointer}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--dab);color:#fff;font-weight:700}
:focus-visible{outline:3px solid var(--pat);outline-offset:1px}
input,select{background:#101d21;border:1px solid var(--line);border-radius:6px;padding:8px}
.app{display:grid;grid-template-columns:25% 1fr;height:100vh}
.left{background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:300px}
.right{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:24px}h2{margin:0;font-size:16px;color:var(--mute)}
.sync{font-size:12px;color:var(--mute)}.sync.on{color:#58d68d}.sync.off{color:var(--orange)}
.big{position:relative;display:block}
#num{width:100%;font-size:30px;font-weight:700;padding:10px 70px 10px 12px}
#pv{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:700;color:var(--gold)}
.last{display:flex;align-items:center;gap:10px;background:var(--gold);color:var(--pi);border-radius:8px;padding:6px 12px;flex-wrap:wrap}.last .mute{color:#5b4a0f}
#last{display:flex;align-items:baseline;gap:8px}
.lt{font-size:20px}.ln{font-size:34px;line-height:1}
.mute{color:var(--mute)}
#recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:#5b4a0f}
#recent span{background:#fff7;border-radius:4px;padding:1px 6px;color:var(--pi)}
#recent em{margin-left:auto;font-style:normal}
.row{display:flex;gap:8px}.row>*{flex:1}
.board{display:grid;grid-template-columns:14px repeat(15,1fr);gap:2px;align-items:center}
.board b{color:var(--gold);font-size:13px}
.board button{padding:3px 0;font-size:11px;border-radius:3px;background:#10303a;color:var(--mute)}
.board button.on{background:var(--dab);color:#fff;font-weight:700}
.board button.last{outline:2px solid var(--gold)}
.pat{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:170px}
.pg button{aspect-ratio:1;background:#10303a;border:1px solid var(--line)}
.pg button.on{background:var(--pat)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--mute)}
details .row{margin-top:8px;flex-wrap:wrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#stats{display:flex;gap:8px;flex-wrap:wrap}
#stats span{padding:3px 10px;border-radius:99px;background:var(--panel)}
#stats .g{background:var(--gold);color:var(--pi);font-weight:700}#stats .r{background:var(--red)}#stats .o{background:var(--orange);color:var(--pi)}
.bar .row{align-items:center}.bar .row>*{flex:none}
.bar label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cs),1fr));gap:10px;padding:12px;align-content:start;overflow:auto;flex:1}
.empty{grid-column:1/-1;color:var(--mute);padding:40px;text-align:center}
.mc{background:var(--paper);color:var(--pi);border-radius:6px;padding:5px;border:3px solid transparent;cursor:pointer}
.mh{display:flex;justify-content:space-between;font-size:13px;padding:0 3px 3px;border-radius:3px}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.mg i{font-style:normal;text-align:center;font-size:11px;line-height:21px;background:#e6dfc9;border-radius:3px}
.mg i.m{background:var(--dab);color:#fff;font-weight:700}
.mg i.p{box-shadow:inset 0 0 0 2px var(--pat)}
.s0{border-color:var(--gold);animation:glow 1.4s ease-in-out infinite}
.s0 .mh{background:var(--gold);font-weight:700}
.s1{border-color:var(--red)}.s1 .mh{color:var(--red);font-weight:700}
.s2{border-color:var(--orange)}.s2 .mh{font-weight:700}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(246,195,67,.5)}}
@media (prefers-reduced-motion:reduce){.s0{animation:none;box-shadow:0 0 0 4px rgba(246,195,67,.5)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:#000c;font-size:18px;display:none;z-index:20}
#toast.show{display:block}#toast.bad{background:var(--red)}#toast.gold{background:var(--gold);color:var(--pi);font-size:28px;font-weight:700}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.box{background:var(--panel);border-radius:12px;padding:18px;width:min(460px,95vw);max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.mtop h2{width:100%;font-size:20px;color:var(--ink)}
.mtop label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
#cno{width:90px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--paper);padding:10px;border-radius:8px}
.mgrid b{text-align:center;color:var(--pi);font-size:22px}
.mgrid input{width:100%;text-align:center;font-size:26px;font-weight:700;padding:8px 0;background:#fff;color:var(--pi);border:2px solid #cfc7ae}
.mgrid input.bad{background:#ffd5d5;border-color:var(--red)}
.free{display:flex;align-items:center;justify-content:center;font-size:26px;color:#b8860b}
#mmsg.bad{color:var(--red)}#mmsg.ok{color:#58d68d}
.mbtn{display:flex;gap:8px;flex-wrap:wrap}
#mprog{color:var(--mute);font-size:14px;margin:0}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}textarea{background:#101d21;border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);font:inherit}.krow{display:flex;gap:8px;align-items:center}.krow input[type=password]{flex:1}.krow label{font-size:13px;color:var(--mute);white-space:nowrap}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.right{height:auto}.left{min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside class="left">
  <div class="top"><h1>Bingo Night</h1><span id="sync" class="sync">● Local lang</span><button id="setb">⚙ Settings</button></div>
  <label class="big"><input id="num" inputmode="numeric" autocomplete="off" placeholder="Number na tinawag" aria-label="Number na tinawag"><span id="pv"></span></label>
  <div class="last"><div id="last"></div><div id="recent"></div></div>
  <div class="row"><button id="undo">Undo last</button><button id="addc" class="pri">+ Add card</button></div>
  <div id="board" class="board"></div>
  <section class="pat">
    <h2>Game at pattern</h2>
    <input id="gname" aria-label="Pangalan ng game">
    <select id="pre" aria-label="Pattern"></select>
    <div id="pg" class="pg" title="I-click para mag-drawing ng pattern"></div>
    <div class="row"><button id="pclear">Clear pattern</button><button id="preset">Reset pattern</button></div>
    <button id="newg">New game (reset numbers)</button>
  </section>
  <details><summary>Tools</summary>
    <label class="fl" style="margin-top:8px">Ilang sample cards ang ge-generate <input id="scount" type="number" min="1" max="200" value="50"></label>
    <label class="fl" style="margin-top:8px">Import cards (JSON o .txt file galing sa AI) <input id="impf" type="file" accept=".json,.txt,application/json"></label>
    <a href="CardIntake.html" target="_blank" style="color:var(--pat);display:block;margin-top:8px">Buksan ang CardIntake (API)</a>
    <div class="row"><button id="sample">Generate sample cards</button><button id="rnd">Random call (test)</button><button id="delall">Delete all cards</button></div>
  </details>
</aside>
<main class="right">
  <div class="bar">
    <div id="stats"></div>
    <div class="row">
      <label>Laki <input id="size" type="range" min="115" max="230" value="150"></label>
      <button id="sort">Sort: Card #</button><button id="flt">Show: lahat</button>
    </div>
  </div>
  <div id="cards" class="cards"></div>
</main>
</div>
<div id="toast" role="status"></div>

<div id="modal" class="modal" hidden>
 <div class="box" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mtop">
    <h2 id="mt">Add card</h2>
    <label>Card # <input id="cno" type="number" min="1"></label>
    <label>Ayos ng pag-type <select id="ord"><option value="r">Row by row</option><option value="c">Column by column</option></select></label>
  </div>
  <div id="mg" class="mgrid"></div>
  <div id="mmsg"></div>
  <div class="mbtn"><button id="sn" class="pri">Save &amp; next</button><button id="sc">Save &amp; close</button><button id="del">Delete card</button><button id="cx">Cancel</button></div>
  <p id="mprog"></p>
 </div>
</div>

<div id="smodal" class="modal" hidden>
 <div class="box" role="dialog" aria-modal="true" aria-labelledby="st">
  <h2 id="st" style="font-size:20px;color:var(--ink)">Settings</h2>
  <label class="fl">Firebase config (i-paste ang buong firebaseConfig snippet)<textarea id="fbtxt" rows="6"></textarea></label>
  <label class="fl">Database URL (optional; auto-gagawin kung blangko)<input id="fburl" placeholder="https://...firebasedatabase.app"></label>
  <div id="fbst" class="mute"></div>
  <div class="mbtn"><button id="fbsave" class="pri">Save config at i-reload</button><button id="fbclr">Alisin ang config</button></div>
  <h2>API keys para sa CardIntake</h2>
  <div id="keys" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="mute" style="font-size:13px">Naka-save sa Firebase (/bingoSecrets). Mababasa ito ng sinumang may access sa database, kaya higpitan ang database rules. I-check ang "ubos" kung wala nang token ang key.</div>
  <div class="mbtn"><button id="keysave" class="pri">Save API keys</button><button id="sclose">Close</button></div>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Firebase config: ilalagay sa ⚙ Settings (naka-save sa browser). Kapag wala, local lang ang save. */
let FB={};try{FB=JSON.parse(localStorage.getItem("bingoFB"))||{}}catch(e){}
if(FB.projectId&&!FB.databaseURL)FB.databaseURL=`https://${FB.projectId}-default-rtdb.firebaseio.com`;
let db=null;

const TOTAL=50,L="BINGO",COLS=[[1,15],[16,30],[31,45],[46,60],[61,75]],KEY="bingoState";
const $=id=>document.getElementById(id);
const P=f=>Array.from({length:25},(_,i)=>f(Math.floor(i/5),i%5)?1:0);
const rows=[0,1,2,3,4].map(k=>P(r=>r==k)),cols=[0,1,2,3,4].map(k=>P((r,c)=>c==k)),diag=[P((r,c)=>r==c),P((r,c)=>r+c==4)];
const PRE={
 none:{n:"Walang pattern",m:[]},
 line:{n:"Any line",m:[...rows,...cols,...diag]},
 rows:{n:"Horizontal",m:rows},cols:{n:"Vertical",m:cols},diag:{n:"Diagonal",m:diag},
 corners:{n:"4 Corners",m:[P((r,c)=>r%4==0&&c%4==0)]},
 x:{n:"X",m:[P((r,c)=>r==c||r+c==4)]},
 t:{n:"Letter T",m:[P((r,c)=>r==0||c==2)]},
 l:{n:"Letter L",m:[P((r,c)=>c==0||r==4)]},
 stamp:{n:"Postage stamp (any corner)",m:[[0,0],[0,3],[3,0],[3,3]].map(([a,b])=>P((r,c)=>r>=a&&r<a+2&&c>=b&&c<b+2))},
 full:{n:"Blackout",m:[P(()=>1)]},
 custom:{n:"Custom (drawing)",m:[]}
};
$("pre").innerHTML=Object.entries(PRE).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("");

/* ---------- state ---------- */
function norm(v){
 v=v||{};const cards={};
 Object.entries(v.cards||{}).forEach(([k,g])=>{if(g&&Array.from(g).length==25)cards[k]=Array.from(g).map(Number)});
 return{cards,called:Array.from(v.called||[]).map(Number),game:Object.assign({name:"Game 1",preset:"none",custom:"0".repeat(25)},v.game||{})};
}
let S;try{S=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=norm()}
let ref=null,sortMode="no",flt=false,editing=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(ref)ref.set(S);render()}

if(FB.apiKey&&FB.databaseURL&&window.firebase){
 try{
  firebase.initializeApp(FB);db=firebase.database();ref=db.ref("bingo");
  ref.on("value",s=>{const v=s.val();if(v){S=norm(v);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else ref.set(S)});
  db.ref(".info/connected").on("value",s=>{const on=s.val();$("sync").textContent=on?"● Firebase synced":"● Offline (local muna)";$("sync").className="sync "+(on?"on":"off")});
 }catch(e){console.error(e)}
}

/* ---------- logic ---------- */
function masks(){const g=S.game;if(g.preset=="custom")return g.custom.includes("1")?[[...g.custom].map(Number)]:[];return PRE[g.preset]?PRE[g.preset].m:[]}
function evalCard(g,cs,ms){
 if(!ms.length)return{rem:null,mask:[]};
 let best=99,bm=[];
 for(const m of ms){let r=0;for(let i=0;i<25;i++)if(m[i]&&i!=12&&!cs.has(g[i]))r++;if(r<best){best=r;bm=m}}
 return{rem:best,mask:bm};
}
function bingos(){
 const cs=new Set(S.called),ms=masks(),s=new Set();
 if(ms.length)for(const[n,g]of Object.entries(S.cards))if(evalCard(g,cs,ms).rem===0)s.add(+n);
 return s;
}
let tt;function toast(t,c=""){const e=$("toast");e.textContent=t;e.className="show "+c;clearTimeout(tt);tt=setTimeout(()=>e.className="",c=="gold"?6000:2200)}
function addNum(n){
 if(!(n>=1&&n<=75))return toast("Number 1–75 lang","bad");
 if(S.called.includes(n))return toast(n+" ay natawag na","bad");
 const b=bingos();S.called.push(n);save();
 const nw=[...bingos()].filter(x=>!b.has(x));
 if(nw.length)toast("BINGO! Card "+nw.map(x=>"#"+x).join(", "),"gold");
}
const letter=n=>L[Math.ceil(n/15)-1];

/* ---------- render ---------- */
function renderLeft(){
 const c=new Set(S.called),last=S.called[S.called.length-1];
 $("last").innerHTML=last?`<b class="lt">${letter(last)}</b><b class="ln">${last}</b>`:'<span class="mute">Wala pang tinawag</span>';
 $("recent").innerHTML=S.called.slice(-7,-1).reverse().map(n=>`<span>${letter(n)}${n}</span>`).join("")+(S.called.length?`<em>${S.called.length} / 75</em>`:"");
 $("board").innerHTML=[0,1,2,3,4].map(r=>`<b>${L[r]}</b>`+Array.from({length:15},(_,k)=>{const n=r*15+k+1;return`<button data-n="${n}" class="${c.has(n)?"on":""}${n==last?" last":""}">${n}</button>`}).join("")).join("");
 const g=S.game;if(document.activeElement!==$("gname"))$("gname").value=g.name;$("pre").value=g.preset;
 const u=Array(25).fill(0);masks().forEach(m=>m.forEach((v,i)=>{if(v)u[i]=1}));
 $("pg").innerHTML=u.map((v,i)=>`<button data-i="${i}" class="${v?"on":""}" aria-label="cell ${i+1}"></button>`).join("");
}
function renderCards(){
 const cs=new Set(S.called),ms=masks();
 let list=Object.keys(S.cards).map(Number).map(n=>({n,g:S.cards[n],...evalCard(S.cards[n],cs,ms)}));
 const k={0:0,1:0,2:0};list.forEach(x=>{if(x.rem!==null&&x.rem<=2)k[x.rem]++});
 $("stats").innerHTML=`<span>Cards ${list.length}/${Math.max(TOTAL,list.length)}</span>`+(ms.length?`<span class="g">BINGO ${k[0]}</span><span class="r">1 na lang ${k[1]}</span><span class="o">2 na lang ${k[2]}</span>`:'<span>Walang pattern na napili</span>');
 if(flt)list=list.filter(x=>x.rem!==null&&x.rem<=2);
 list.sort((a,b)=>{if(sortMode=="close"){const d=(a.rem??99)-(b.rem??99);if(d)return d}return a.n-b.n});
 $("cards").innerHTML=list.length?list.map(x=>{
  const near=x.rem!==null&&x.rem<=2;
  const lbl=x.rem===null?"":x.rem==0?"BINGO":near?x.rem+" na lang":x.rem+" kulang";
  return`<div class="mc s${near?x.rem:"x"}" data-n="${x.n}" title="I-click para i-edit"><div class="mh"><b>#${x.n}</b><span>${lbl}</span></div><div class="mg">${x.g.map((v,i)=>`<i class="${i==12||cs.has(v)?"m ":""}${x.mask[i]?"p":""}">${i==12?"★":v}</i>`).join("")}</div></div>`;
 }).join(""):`<div class="empty">${Object.keys(S.cards).length?"Walang card na tugma sa filter.":"Wala pang cards. Pindutin ang + Add card (o Tools para sa sample cards)."}</div>`;
}
function render(){renderLeft();renderCards()}

/* ---------- main controls ---------- */
$("num").oninput=e=>{const v=e.target.value.replace(/\D/g,"").slice(0,2);e.target.value=v;$("pv").textContent=v>=1&&v<=75?letter(+v)+"-"+(+v):""};
$("num").onkeydown=e=>{if(e.key=="Enter"){addNum(+e.target.value);e.target.value="";$("pv").textContent=""}};
$("board").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.n;if(S.called.includes(n)){S.called=S.called.filter(x=>x!=n);save()}else addNum(n)};
$("undo").onclick=()=>{S.called.pop();save();$("num").focus()};
$("gname").onchange=e=>{S.game.name=e.target.value;save()};
$("pre").onchange=e=>{S.game.preset=e.target.value;save()};
$("pg").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,g=S.game;
 let base=g.preset=="custom"?g.custom:(PRE[g.preset].m.length==1?PRE[g.preset].m[0].join(""):"0".repeat(25));
 const a=[...base];a[i]=a[i]=="1"?"0":"1";g.custom=a.join("");g.preset="custom";save();
};
$("pclear").onclick=()=>{S.game.preset="custom";S.game.custom="0".repeat(25);save()};
$("preset").onclick=()=>{S.game.preset="none";save()};
$("newg").onclick=()=>{
 if(!confirm("Bagong game? Buburahin ang mga tinawag na number (hindi ang cards)."))return;
 S.called=[];const m=/^Game (\d+)$/.exec(S.game.name);if(m)S.game.name="Game "+(+m[1]+1);save();$("num").focus();
};
$("sort").onclick=()=>{sortMode=sortMode=="no"?"close":"no";$("sort").textContent="Sort: "+(sortMode=="no"?"Card #":"Pinakamalapit");renderCards()};
$("flt").onclick=()=>{flt=!flt;$("flt").textContent="Show: "+(flt?"1–2 na lang":"lahat");renderCards()};
$("size").oninput=e=>document.documentElement.style.setProperty("--cs",e.target.value+"px");
$("cards").onclick=e=>{const c=e.target.closest(".mc");if(c)openModal(+c.dataset.n)};
$("addc").onclick=()=>openModal();
$("sample").onclick=()=>{
 if(Object.keys(S.cards).length&&!confirm("Papalitan ang lahat ng cards ng sample?"))return;
 S.cards={};
 for(let n=1,cnt=Math.max(1,Math.min(200,+$("scount").value||50));n<=cnt;n++){const g=Array(25).fill(0);
  COLS.forEach(([a,b],c)=>{const pool=Array.from({length:b-a+1},(_,i)=>a+i);for(let r=0;r<5;r++){if(r*5+c==12)continue;g[r*5+c]=pool.splice(Math.floor(Math.random()*pool.length),1)[0]}});
  S.cards[n]=g}
 save();
};
$("rnd").onclick=()=>{const left=Array.from({length:75},(_,i)=>i+1).filter(n=>!S.called.includes(n));if(left.length)addNum(left[Math.floor(Math.random()*left.length)])};
$("delall").onclick=()=>{if(confirm("Burahin ang LAHAT ng cards?")){S.cards={};save()}};

/* ---------- Add / edit card modal ---------- */
const IN=[],ok=(n,c)=>n>=COLS[c][0]&&n<=COLS[c][1];
const ext=(v,c)=>{for(let n=COLS[c][0];n<=COLS[c][1];n++){const s=""+n;if(s!=v&&s.startsWith(v))return true}return false};
const ord=()=>{const a=[];if($("ord").value=="r"){for(let i=0;i<25;i++)if(i!=12)a.push(i)}else for(let c=0;c<5;c++)for(let r=0;r<5;r++){const i=r*5+c;if(i!=12)a.push(i)}return a};
[...L].forEach(l=>{const b=document.createElement("b");b.textContent=l;$("mg").append(b)});
for(let i=0;i<25;i++){
 if(i==12){const d=document.createElement("div");d.className="free";d.textContent="★";$("mg").append(d);continue}
 const x=document.createElement("input");x.inputMode="numeric";x.autocomplete="off";x.setAttribute("aria-label",L[i%5]+" row "+(Math.floor(i/5)+1));
 IN[i]=x;$("mg").append(x);
 x.onfocus=()=>x.select();
 x.oninput=()=>{
  x.value=x.value.replace(/\D/g,"").slice(0,2);check();const v=x.value;
  if(v&&ok(+v,i%5)&&!ext(v,i%5)){const o=ord(),p=o.indexOf(i);p<o.length-1?IN[o[p+1]].focus():$("sn").focus()}
 };
 x.onkeydown=e=>{
  const k=e.key,o=ord(),p=o.indexOf(i);
  if(k=="Enter"||k==" "){e.preventDefault();p==o.length-1?(!$("sn").disabled&&saveCard(false)):IN[o[p+1]].focus()}
  else if(k=="Backspace"&&!x.value&&p>0){e.preventDefault();IN[o[p-1]].focus()}
  else if(k.startsWith("Arrow")){e.preventDefault();const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[k];let j=i+d;if(j==12)j+=d;if(IN[j])IN[j].focus()}
 };
}
function check(){
 const cnt={};IN.forEach(x=>{if(x&&x.value)cnt[+x.value]=(cnt[+x.value]||0)+1});
 let miss=0,bad=0;
 IN.forEach((x,i)=>{if(!x)return;const v=x.value,b=v&&(!ok(+v,i%5)||cnt[+v]>1);x.classList.toggle("bad",!!b);if(!v)miss++;else if(b)bad++});
 const good=!miss&&!bad&&+$("cno").value>=1;
 $("mmsg").textContent=bad?`${bad} cell na mali (labas sa range o duplicate)`:miss?`${miss} cell na lang ang kulang`:"Handa nang i-save";
 $("mmsg").className=bad?"bad":good?"ok":"";
 $("sn").disabled=$("sc").disabled=!good;
 return good;
}
function openModal(no){
 editing=no==null?null:no;const g=no==null?null:S.cards[no];
 const miss=[];for(let n=1;n<=TOTAL;n++)if(!S.cards[n])miss.push(n);
 $("cno").value=no??(miss[0]??Object.keys(S.cards).length+1);
 IN.forEach((x,i)=>{if(x)x.value=g?g[i]:""});
 $("mt").textContent=g?"Edit Card #"+no:"Add card";$("del").hidden=!g;
 $("mprog").textContent=`Na-load: ${Object.keys(S.cards).length} / ${TOTAL}`+(miss.length?`. Kulang: ${miss.slice(0,15).join(", ")}${miss.length>15?"…":""}`:"");
 $("modal").hidden=false;check();IN[ord()[0]].focus();
}
function closeModal(){$("modal").hidden=true;$("num").focus()}
function saveCard(close){
 if(!check())return;const no=+$("cno").value;
 if(S.cards[no]&&editing!==no&&!confirm(`May Card #${no} na. Papalitan?`))return;
 if(editing!==null&&editing!==no)delete S.cards[editing];
 const g=Array(25).fill(0);IN.forEach((x,i)=>{if(x)g[i]=+x.value});
 S.cards[no]=g;editing=null;save();toast(`Card #${no} na-save`);
 close?closeModal():openModal();
}
$("cno").oninput=check;$("ord").onchange=()=>IN[ord()[0]].focus();
$("sn").onclick=()=>saveCard(false);$("sc").onclick=()=>saveCard(true);$("cx").onclick=closeModal;
$("del").onclick=()=>{if(editing!==null&&confirm(`Burahin ang Card #${editing}?`)){delete S.cards[editing];save();closeModal()}};
document.addEventListener("keydown",e=>{
 if(e.key=="Escape"&&!$("modal").hidden)closeModal();
 else if(e.key=="+"&&$("modal").hidden&&!["TEXTAREA"].includes(e.target.tagName)&&e.target.id!="gname"){e.preventDefault();openModal()}
});

/* ---------- import JSON ---------- */
$("impf").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 let j;try{j=JSON.parse((await f.text()).replace(/```json|```/g,"").trim())}catch(err){return toast("Hindi valid na JSON ang file","bad")}
 const arr=Array.isArray(j)?j:j&&j.cards;
 if(!Array.isArray(arr))return toast("Walang 'cards' list sa file","bad");
 const good=[],skip=[],seen=new Set();
 arr.forEach((c,k)=>{
  const label=c&&c.no!=null?"Card #"+c.no:"item "+(k+1);
  let g=c&&(c.grid||c.numbers);if(Array.isArray(g)&&Array.isArray(g[0]))g=g.flat();
  if(!Array.isArray(g)||g.length!=25)return skip.push(label+": hindi 5x5");
  g=g.map(v=>v==null||v===""?NaN:Number(v));g[12]=0;
  const cnt={};
  if(g.some((v,i)=>i!=12&&(!Number.isInteger(v)||!ok(v,i%5)||(cnt[v]=(cnt[v]||0)+1)>1)))return skip.push(label+": may mali o kulang na number");
  const key=g.join(",");if(seen.has(key))return skip.push(label+": duplicate ng ibang card");
  seen.add(key);const no=+c.no;good.push({no:Number.isInteger(no)&&no>0?no:null,g,key});
 });
 if(!good.length)return alert("Walang valid na card sa file.\n"+skip.slice(0,15).join("\n"));
 if(!confirm(`${good.length} valid na cards, ${skip.length} skipped. I-import?`))return;
 const replace=Object.keys(S.cards).length&&confirm("May existing cards na.\nOK = PALITAN lahat\nCancel = idagdag lang (papalitan ang kaparehong Card #)");
 const cards=replace?{}:{...S.cards},used=new Set(),rest=[];
 const ex=new Map(replace?[]:Object.entries(S.cards).map(([n,g])=>[g.join(","),+n]));
 good.forEach(x=>{
  if(ex.has(x.key)&&ex.get(x.key)!==x.no)return skip.push(`Card #${x.no??"?"}: kapareho ng existing Card #${ex.get(x.key)}`);
  if(x.no&&!used.has(x.no)){cards[x.no]=x.g;used.add(x.no)}else rest.push(x);
 });
 rest.forEach(x=>{let n=1;while(cards[n])n++;cards[n]=x.g});
 S.cards=cards;save();
 const total=good.length-skip.filter(t=>t.includes("existing")).length;
 toast(`Na-import ang ${total} cards`);
 if(skip.length)alert("Hindi na-import:\n"+skip.slice(0,15).join("\n")+(skip.length>15?"\n…":""));
};

/* ---------- settings ---------- */
function parseCfg(t){const o={};for(const k of["apiKey","authDomain","databaseURL","projectId","storageBucket","messagingSenderId","appId"]){const m=new RegExp(k+'\\s*:\\s*[\'"]([^\'"]+)[\'"]').exec(t);if(m)o[k]=m[1]}return o}
const krows=$("keys");
krows.innerHTML=[0,1,2,3,4].map(i=>`<div class="krow"><input type="password" autocomplete="off" placeholder="API key #${i+1}" aria-label="API key ${i+1}"><label><input type="checkbox"> ubos</label></div>`).join("");
$("setb").onclick=()=>{
 $("fbtxt").value="";$("fburl").value=FB.databaseURL||"";
 $("fbst").textContent=FB.projectId?"Project: "+FB.projectId+(ref?"":" (hindi pa konektado)"):"Wala pang Firebase config.";
 $("smodal").hidden=false;
 if(db)db.ref("bingoSecrets/keys").once("value").then(s=>{const v=Array.from(s.val()||[]);krows.querySelectorAll(".krow").forEach((r,i)=>{const k=v[i]||{};r.children[0].value=k.k||"";r.querySelector("[type=checkbox]").checked=!!k.bad})});
};
$("fbsave").onclick=()=>{
 const o=parseCfg($("fbtxt").value),url=$("fburl").value.trim();
 if(!o.apiKey&&!FB.apiKey)return toast("I-paste muna ang firebaseConfig","bad");
 const n=Object.assign({},o.apiKey?o:FB);if(url)n.databaseURL=url;else if(o.apiKey)delete n.databaseURL;
 localStorage.setItem("bingoFB",JSON.stringify(n));location.reload();
};
$("fbclr").onclick=()=>{if(confirm("Alisin ang Firebase config sa device na ito?")){localStorage.removeItem("bingoFB");location.reload()}};
$("keysave").onclick=()=>{
 if(!db)return toast("Ilagay muna ang Firebase config","bad");
 const v=[...krows.querySelectorAll(".krow")].map(r=>({k:r.children[0].value.trim(),bad:r.querySelector("[type=checkbox]").checked}));
 db.ref("bingoSecrets/keys").set(v).then(()=>toast("Na-save ang API keys")).catch(e=>toast("Error: "+e.message,"bad"));
};
$("sclose").onclick=()=>{$("smodal").hidden=true;$("num").focus()};

render();$("num").focus();
</script>
